<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AutoDev Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      color: #e0e0e0;
      overflow: hidden;
    }
    #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 123, 255, 0.3);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 123, 255, 0.2);
      transition: opacity 0.3s ease;
    }
    #header {
      padding: 10px 12px;
      background: rgba(0, 123, 255, 0.1);
      border-bottom: 1px solid rgba(0, 123, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 16px 16px 0 0;
      cursor: move;
      -webkit-app-region: drag;
      user-select: none;
    }
    #header button {
      -webkit-app-region: no-drag;
    }
    #status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CAF50;
      margin-right: 8px;
      display: inline-block;
    }
    #status.disconnected { background: #f44336; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 10px;
      border-radius: 8px;
      max-width: 85%;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #007bff;
      color: white;
    }
    .msg.ai {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
    }
    .msg.system {
      align-self: center;
      background: rgba(0, 200, 100, 0.1);
      border: 1px solid rgba(0, 200, 100, 0.3);
      font-size: 12px;
      color: #90EE90;
    }
    #actions {
      padding: 8px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      background: rgba(0, 0, 0, 0.3);
    }
    .btn {
      padding: 6px 10px;
      background: rgba(0, 123, 255, 0.2);
      border: 1px solid rgba(0, 123, 255, 0.3);
      color: #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn:hover {
      background: rgba(0, 123, 255, 0.3);
    }
    #input-area {
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(0, 123, 255, 0.3);
      border-radius: 8px;
      color: #e0e0e0;
      outline: none;
    }
    #send {
      padding: 10px 20px;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div><span id="status"></span> AutoDev Assistant</div>
      <div style="display: flex; gap: 4px;">
        <button class="btn" onclick="toggleCompact()" title="Compact Mode">📱</button>
        <button class="btn" onclick="toggleGhost()" title="Ghost Mode">👻</button>
        <button class="btn" onclick="minimize()" title="Minimize">➖</button>
        <button class="btn" onclick="window.close()" title="Close">✕</button>
      </div>
    </div>
    <div id="chat"></div>
    <div id="actions">
      <button class="btn" onclick="capture()">📸 Capture</button>
      <button class="btn" onclick="analyze()">👁️ Analyze</button>
      <button class="btn" onclick="codeGen()">💻 Code</button>
      <button class="btn" onclick="fixErrors()">🔧 Fix</button>
      <button class="btn" onclick="openCursor()">🎯 Cursor</button>
      <button class="btn" id="autoBtn" onclick="toggleAuto()">▶️ Auto</button>
    </div>
    <div id="input-area">
      <input id="input" placeholder="Ask anything..." onkeypress="if(event.key=='Enter')send()">
      <button id="send" onclick="send()">Send</button>
    </div>
  </div>
  <script>
    let port = 5178;
    let ws = null;
    let history = [];
    let autoRunning = false;
    let ghostMode = false;
    let compactMode = false;
    
    async function init() {
      port = await window.autodev.getBackendPort();
      connect();
      
      // Add welcome message
      setTimeout(() => {
        addMsg('👋 Welcome to AutoDev Assistant!', 'system');
        addMsg('I can help you with:', 'system');
        addMsg('• 💬 Chat - Type messages below\n• 📸 Capture - Take screenshots\n• 👁️ Analyze - Understand what\'s on screen\n• 💻 Code - Generate code\n• 🔧 Fix - Fix errors\n• 🎯 Cursor - Open Cursor editor\n• ▶️ Auto - Start autonomous mode', 'ai');
      }, 500);
    }
    
    function connect() {
      ws = new WebSocket(`ws://localhost:${port}/ws`);
      ws.onopen = () => {
        document.getElementById('status').className = '';
        addMsg('Connected to AutoDev', 'system');
      };
      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        
        // Handle different message types
        switch(data.type) {
          case 'suggestion':
            if (data.suggestion) {
              addMsg(data.suggestion, 'ai');
            }
            if (data.history) history = data.history;
            break;
            
          case 'observe':
            addMsg(`👁️ Observed: ${data.analysis?.substring(0, 200)}...`, 'system');
            break;
            
          case 'action':
            addMsg(`⚡ Action: ${data.step?.action || 'Processing'}`, 'system');
            break;
            
          case 'task:complete':
            addMsg(`✅ Task completed: ${data.task?.type || 'Unknown'}`, 'system');
            break;
            
          case 'loop:status':
            addMsg(`🔄 Loop ${data.status}`, 'system');
            break;
            
          case 'control:mouse':
          case 'control:keyboard':
          case 'control:app':
            addMsg(`🎮 ${data.action}: ${data.text || data.appName || data.button || ''}`, 'system');
            break;
            
          case 'connected':
            console.log('Backend connected with config:', data.config);
            break;
            
          default:
            console.log('Unknown message type:', data.type, data);
        }
      };
      ws.onclose = () => {
        document.getElementById('status').className = 'disconnected';
        setTimeout(connect, 3000);
      };
    }
    
    function addMsg(text, type = 'ai') {
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      msg.textContent = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }
    
    function send() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      sendMsg(text);
      input.value = '';
    }
    
    async function sendMsg(text) {
      addMsg(text, 'user');
      try {
        const res = await fetch(`http://localhost:${port}/api/suggest`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({prompt: text})
        });
        const data = await res.json();
        if (data.error) {
          addMsg(`Error: ${data.error}`, 'ai');
        } else if (data.suggestion) {
          // FIXED: Actually display the AI response!
          addMsg(data.suggestion, 'ai');
        }
      } catch (e) {
        addMsg(`Error: ${e.message}`, 'ai');
      }
    }
    
    async function capture() {
      addMsg('📸 Capturing screen...', 'system');
      try {
        const res = await fetch(`http://localhost:${port}/api/vision/capture`, {method: 'POST'});
        const data = await res.json();
        addMsg(`✅ Screenshot saved: ${data.imagePath}`, 'system');
        return data.imagePath;
      } catch (e) {
        addMsg(`❌ Capture failed: ${e.message}`, 'system');
        return null;
      }
    }
    
    async function analyze() {
      addMsg('👁️ Starting screen analysis...', 'system');
      const img = await capture();
      if (!img) return;
      
      addMsg('🔍 Analyzing with GPT-4o vision...', 'system');
      try {
        const res = await fetch(`http://localhost:${port}/api/vision/analyze`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({imagePath: img, prompt: 'Analyze the screen and describe what you see, including any code, errors, or UI elements'})
        });
        const data = await res.json();
        if (data.analysis) {
          addMsg('Analysis complete:', 'system');
          addMsg(data.analysis, 'ai');
        } else {
          addMsg('❌ No analysis received', 'system');
        }
      } catch (e) {
        addMsg(`❌ Analysis failed: ${e.message}`, 'system');
      }
    }
    
    async function openCursor() {
      addMsg('🎯 Opening Cursor editor...', 'system');
      try {
        const res = await fetch(`http://localhost:${port}/api/control/app/open`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({appName: 'Cursor'})
        });
        const data = await res.json();
        if (data.ok) {
          addMsg('✅ Cursor should be opening now', 'system');
        } else {
          addMsg(`❌ Failed to open Cursor: ${data.error}`, 'system');
        }
      } catch (e) {
        addMsg(`❌ Failed: ${e.message}`, 'system');
      }
    }
    
    async function startAuto() {
      try {
        // Start the autonomous loop
        const res = await fetch(`http://localhost:${port}/api/loop/start`, {method: 'POST'});
        const data = await res.json();
        
        if (data.ok) {
          autoRunning = true;
          document.getElementById('autoBtn').textContent = '⏸️ Stop';
          addMsg('🤖 Automation started - I will now observe your screen and help automatically', 'system');
          
          // Also queue a basic observation task
          await fetch(`http://localhost:${port}/api/loop/queue`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              task: {
                type: 'observe_and_assist',
                priority: 'normal',
                description: 'Watch screen and provide assistance'
              }
            })
          });
        } else {
          addMsg('Automation failed to start', 'system');
        }
      } catch (e) {
        addMsg(`Failed: ${e.message}`, 'system');
      }
    }
    
    async function stopAuto() {
      try {
        const res = await fetch(`http://localhost:${port}/api/loop/stop`, {method: 'POST'});
        const data = await res.json();
        
        if (data.ok) {
          autoRunning = false;
          document.getElementById('autoBtn').textContent = '▶️ Auto';
          addMsg('🛑 Automation stopped', 'system');
        }
      } catch (e) {
        addMsg(`Failed to stop: ${e.message}`, 'system');
      }
    }
    
    function toggleAuto() {
      if (autoRunning) {
        stopAuto();
      } else {
        startAuto();
      }
    }
    
    async function codeGen() {
      const request = prompt('What code would you like me to generate?');
      if (!request) return;
      
      addMsg(`💻 Generating code for: ${request}`, 'system');
      
      // First capture screen for context
      const img = await capture();
      
      // Then generate code with context
      if (img) {
        sendMsg(`Generate code for: ${request}. Consider what's visible on my screen.`);
      } else {
        sendMsg(`Generate code for: ${request}`);
      }
    }
    
    async function fixErrors() {
      addMsg('🔧 Looking for errors to fix...', 'system');
      
      // Capture screen first
      const img = await capture();
      
      if (img) {
        // Analyze for errors
        try {
          const res = await fetch(`http://localhost:${port}/api/vision/analyze`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              imagePath: img, 
              prompt: 'Identify any errors, warnings, or issues visible on the screen. Focus on terminal output, error messages, or code problems.'
            })
          });
          const data = await res.json();
          
          if (data.analysis) {
            addMsg('Found issues:', 'system');
            addMsg(data.analysis, 'ai');
            
            // Now ask for fixes
            sendMsg('Please provide fixes for the errors/issues you identified above.');
          }
        } catch (e) {
          addMsg(`Error detection failed: ${e.message}`, 'system');
        }
      }
    }
    
    function minimize() {
      window.autodev.minimize();
    }
    
    function toggleGhost() {
      ghostMode = !ghostMode;
      if (ghostMode) {
        // Make window click-through and semi-transparent
        window.autodev.setClickThrough(true);
        document.getElementById('app').style.opacity = '0.3';
        addMsg('👻 Ghost mode ON - Window is click-through', 'system');
      } else {
        // Make window normal
        window.autodev.setClickThrough(false);
        document.getElementById('app').style.opacity = '1';
        addMsg('👻 Ghost mode OFF - Window is interactive', 'system');
      }
    }
    
    function toggleCompact() {
      compactMode = !compactMode;
      const chat = document.getElementById('chat');
      const actions = document.getElementById('actions');
      
      if (compactMode) {
        // Hide chat, show only essential buttons
        chat.style.display = 'none';
        actions.style.padding = '4px';
        document.getElementById('app').style.height = '120px';
        addMsg('📱 Compact mode ON', 'system');
      } else {
        // Show full interface
        chat.style.display = 'flex';
        actions.style.padding = '8px';
        document.getElementById('app').style.height = '100%';
        addMsg('📱 Compact mode OFF', 'system');
      }
    }
    
    // Add keyboard shortcut for quick toggle
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'g') {
        toggleGhost();
      }
      if (e.key === 'Escape') {
        minimize();
      }
    });
    
    init();
  </script>
</body>
</html>
